<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f4ec" />
    <link rel="icon" href="data:," />
    <title>CHICKEN Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
    </style>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ec;
        --panel: #fffefa;
        --ink: #24312b;
        --ink-soft: #5f6f66;
        --ink-faint: #9aa79d;
        --line: #d9d2bf;
        --line-soft: #e6e0cf;
        --accent: #0c4a36;
        --serif: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
        --mono: "IBM Plex Mono", monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
      body {
        font-family: var(--serif);
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: var(--mono); }
      button { font-family: inherit; cursor: pointer; }
      .hidden { display: none !important; }

      /* ---------- entrance: full-screen cover image only, nothing over or around it ----------
         The stage is fixed to the viewport itself (inset: 0), so the picture
         always reaches every edge of the screen regardless of how the
         webview measures viewport height units; and nothing outside the
         picture is painted green — the page ground is the same ecru as the
         inner pages, so no coloured band can appear around the image. */
      .stage {
        position: fixed; inset: 0;
        overflow: hidden;
        background: var(--bg);
      }
      .frame {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        transition: transform 1.1s cubic-bezier(.5, 0, .2, 1);
      }
      .stage.diving .frame { transform: scale(1.07); }
      .stage-img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        display: block;
      }
      /* Portrait / narrow viewports: the "CHECK HERE" lipstick writing
         is painted into the picture itself, on the left side of the
         mirror (image x 211–461 of 1216). A centred cover crop would
         push it off screen, so the projection shifts left (15%) —
         the mirror mask hit test in JS uses this exact same 15%
         under the same media condition, so taps stay glued to the
         glass. Landscape keeps the centred 50% crop. */
      @media (max-aspect-ratio: 1/1) {
        .stage-img { object-position: 15% 50%; }
      }
      /* invisible touch area covering the same full-screen frame:
         hit-tested per pixel against the painted mirror mask in JS
         using the same cover geometry, so the touch range never
         drifts from the picture however the cover crop falls;
         nothing is drawn over the illustration */
      .hotspot {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        background: transparent;
        border: none;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      .frame.view-2 .hotspot { cursor: default; }
      .frame.view-2.mask-hot .hotspot { cursor: pointer; }
      .hotspot:focus-visible { outline: none; }

      /* ---------- fluorescent flicker on the entrance picture ----------
         Irregular, mostly-quiet flicker: long stretches of calm broken by
         short dips and one brighter sputter, like a tired tube light.
         Applied as a filter on the picture itself so the whole room
         breathes with the light, not just a wash on top. */
      @keyframes fluorFlicker {
        0%, 100% { filter: brightness(1) contrast(1); }
        7% { filter: brightness(1) contrast(1); }
        8% { filter: brightness(.86) contrast(1.02); }
        9% { filter: brightness(1.04) contrast(.99); }
        10% { filter: brightness(.92) contrast(1.01); }
        11%, 38% { filter: brightness(1) contrast(1); }
        39% { filter: brightness(.88) contrast(1.02); }
        40% { filter: brightness(1) contrast(1); }
        41% { filter: brightness(.94) contrast(1.01); }
        42%, 71% { filter: brightness(1) contrast(1); }
        72% { filter: brightness(1.07) contrast(.98); }
        73% { filter: brightness(.82) contrast(1.03); }
        74% { filter: brightness(1.03) contrast(1); }
        75% { filter: brightness(.95) contrast(1.01); }
        76%, 92% { filter: brightness(1) contrast(1); }
        93% { filter: brightness(.9) contrast(1.02); }
        94% { filter: brightness(1) contrast(1); }
      }
      .stage-img { animation: fluorFlicker 4.8s linear infinite; }
      /* faint green-white wash that sputters in time with the picture */
      .fluor-wash {
        position: absolute; inset: 0;
        background: #d9ffe9;
        mix-blend-mode: overlay;
        opacity: 0;
        pointer-events: none;
        animation: fluorWash 4.8s linear infinite;
      }
      @keyframes fluorWash {
        0%, 100% { opacity: 0; }
        8% { opacity: .22; }
        9% { opacity: .04; }
        10% { opacity: .16; }
        11%, 38% { opacity: 0; }
        39% { opacity: .18; }
        40%, 71% { opacity: 0; }
        72% { opacity: .26; }
        73% { opacity: .05; }
        74% { opacity: .14; }
        76%, 92% { opacity: 0; }
        93% { opacity: .15; }
        94% { opacity: 0; }
      }

      /* ---------- dive overlay: a plain fade to the page ground ---------- */
      #dive {
        position: fixed; inset: 0; z-index: 60;
        background: var(--bg);
        opacity: 0; pointer-events: none;
        transition: opacity .55s ease;
      }
      #dive.on { opacity: 1; pointer-events: auto; }

      /* ---------- shared inner layout: quiet, ruled, wide margins ---------- */
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 64px 24px 160px;
      }
      .page-head { margin-bottom: 40px; }
      .page-head .kicker {
        font-family: var(--mono);
        font-size: 11px; letter-spacing: .3em;
        color: var(--ink-faint);
      }
      .page-head h1 {
        margin: 14px 0 0;
        font-size: 34px; font-weight: 700; letter-spacing: .22em;
      }
      .page-head .rule {
        margin-top: 26px;
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--line);
        height: 4px;
      }
      .toolbar {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
        margin-bottom: 34px;
      }
      .toolbar .spacer { flex: 1; }
      .count-note { font-size: 13px; letter-spacing: .14em; color: var(--ink-soft); }
      .count-note .mono { font-size: 12px; }
      .text-btn {
        background: none;
        border: none;
        border-bottom: 1px solid var(--line);
        color: var(--ink);
        padding: 6px 2px;
        font-size: 14px; letter-spacing: .12em;
        min-height: 40px;
      }
      .text-btn:hover { border-bottom-color: var(--accent); color: var(--accent); }

      /* ---------- archive grid: thin-ruled cards ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
        gap: 26px 24px;
      }
      .card {
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 24px 22px 18px;
        display: flex; flex-direction: column;
        width: 100%;
        transition: border-color .18s ease;
      }
      .card:hover { border-color: var(--accent); }
      .card-room {
        font-family: var(--mono);
        font-size: 12px; letter-spacing: .24em;
        color: var(--accent);
      }
      .card-name {
        margin-top: 12px;
        font-size: 20px; font-weight: 700; letter-spacing: .06em; line-height: 1.5;
        color: var(--ink);
      }
      .card-epithet { margin-top: 4px; font-size: 12.5px; letter-spacing: .16em; color: var(--ink-soft); }
      .card-snippet {
        margin-top: 14px;
        font-size: 13.5px; line-height: 1.95; color: var(--ink-soft);
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      .card-foot {
        margin-top: auto; padding-top: 16px;
      }
      .card-foot .open {
        display: block;
        border-top: 1px solid var(--line-soft);
        padding-top: 12px;
        font-size: 12.5px; letter-spacing: .18em; color: var(--accent);
      }

      /* ---------- detail ---------- */
      .detail-room {
        font-family: var(--mono);
        font-size: 12px; letter-spacing: .3em; color: var(--accent);
      }
      .detail-name {
        margin: 14px 0 4px;
        font-size: clamp(27px, 6vw, 38px); font-weight: 700; letter-spacing: .08em; line-height: 1.4;
      }
      .detail-epithet { font-size: 14px; letter-spacing: .18em; color: var(--ink-soft); }
      .detail-rule {
        margin: 30px 0 8px;
        border-top: 1px solid var(--ink);
        border-bottom: 1px solid var(--line);
        height: 4px;
      }
      .guide-photo { margin: 26px 0 0; }
      .guide-photo img {
        width: 100%; height: auto; display: block;
        border: 1px solid var(--line);
      }
      .guide-photo figcaption {
        margin-top: 10px;
        font-size: 12.5px; letter-spacing: .1em; color: var(--ink-soft);
      }
      .section { margin-top: 48px; }
      .section > h2 {
        margin: 0 0 6px;
        font-size: 13px; font-weight: 700; letter-spacing: .3em;
        display: flex; justify-content: space-between; align-items: baseline;
      }
      .section > h2 .mono { font-size: 10px; letter-spacing: .22em; color: var(--ink-faint); font-weight: 400; }
      .profile { margin: 0; border-top: 1px solid var(--line); }
      .profile .row {
        display: grid; grid-template-columns: 118px 1fr; gap: 16px;
        padding: 13px 2px;
        border-bottom: 1px solid var(--line-soft);
        font-size: 15px; line-height: 1.8;
      }
      .profile dt { color: var(--ink-soft); letter-spacing: .14em; font-size: 13.5px; padding-top: 2px; }
      .profile dd { margin: 0; }
      .record-text {
        margin: 0;
        border-top: 1px solid var(--line);
        padding-top: 20px;
        font-size: 15.5px; line-height: 2.15; letter-spacing: .03em;
      }
      .tags-head {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        border-top: 1px solid var(--line);
        padding-top: 20px;
      }
      .tags-head span { font-size: 12.5px; letter-spacing: .18em; color: var(--ink-soft); }
      .copy-btn {
        background: none;
        border: 1px solid var(--accent);
        border-radius: 2px;
        color: var(--accent);
        padding: 8px 18px;
        font-size: 13px; letter-spacing: .12em;
        min-height: 40px;
      }
      .copy-btn.copied { background: var(--accent); color: #fff; }
      .tags-box {
        margin: 14px 0 0;
        border: 1px solid var(--line-soft);
        background: var(--panel);
        padding: 16px;
        font-family: var(--mono);
        font-size: 12.5px; line-height: 2;
        color: var(--ink-soft);
        word-break: break-word;
      }
      .room-nav {
        display: flex; gap: 14px; margin-top: 56px; flex-wrap: wrap;
      }
      .room-nav .nav-btn {
        flex: 1; min-width: 140px;
        background: none;
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--ink);
        padding: 14px 16px;
        font-size: 14px; letter-spacing: .12em;
        text-align: center;
      }
      .room-nav .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
      .room-nav .nav-btn small {
        display: block; margin-top: 4px;
        font-size: 11.5px; letter-spacing: .1em; color: var(--ink-faint);
      }
      .foot-note {
        margin-top: 56px; text-align: center;
        font-size: 12px; letter-spacing: .22em; color: var(--ink-faint);
        line-height: 2.2;
      }
      .foot-note .mono { font-size: 10px; letter-spacing: .28em; }

      /* ---------- playlist player: one ruled bar, nothing more ---------- */
      .player {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        background: rgba(255, 254, 250, 0.97);
        border-top: 1px solid var(--line);
      }
      .player-list {
        max-width: 880px; margin: 0 auto;
        padding: 6px 24px;
        max-height: 38vh; overflow-y: auto;
      }
      .track-row {
        display: flex; align-items: baseline; gap: 16px;
        width: 100%;
        background: none; border: none;
        border-bottom: 1px solid var(--line-soft);
        padding: 13px 2px;
        text-align: left;
        font-size: 15px; letter-spacing: .06em; color: var(--ink);
      }
      .track-row:last-child { border-bottom: none; }
      .track-row .no {
        font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--ink-faint);
      }
      .track-row .state {
        margin-left: auto;
        font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; color: var(--accent);
        white-space: nowrap;
      }
      .track-row.current .tname { color: var(--accent); }
      .player-bar {
        max-width: 880px; margin: 0 auto;
        padding: 10px 24px calc(10px + env(safe-area-inset-bottom));
        display: flex; align-items: center; gap: 6px;
        /* fixed bar height: nothing inside can grow or shrink the
           player, so the rows around it never move */
        height: calc(68px + env(safe-area-inset-bottom, 0px));
        min-height: calc(68px + env(safe-area-inset-bottom, 0px));
        max-height: calc(68px + env(safe-area-inset-bottom, 0px));
        overflow: hidden;
      }
      .player-list-wrap { border-bottom: 1px solid var(--line-soft); }
      .pbtn {
        background: none; border: none;
        width: 44px; height: 44px;
        display: flex; align-items: center; justify-content: center;
        color: var(--ink);
        border-radius: 50%;
      }
      .pbtn:hover { color: var(--accent); }
      .pbtn svg { width: 20px; height: 20px; display: block; }
      .pbtn.play { border: 1px solid var(--line); }
      .pbtn.play:hover { border-color: var(--accent); }
      /* repeat: the three states must stay tellable apart even while
         the pointer or finger is still on the button, so hover never
         borrows the "on" colour (on touch screens the hover state
         sticks after a tap, which made "off" look identical to "on").
         Off is faint and half-transparent; on is deep green at full
         strength; and single-track repeat adds the "1" in the middle
         of the loop. */
      .pbtn.repeat { position: relative; color: var(--ink-faint); opacity: .45; }
      .pbtn.repeat.on { color: var(--accent); opacity: 1; }
      @media (hover: hover) {
        .pbtn.repeat:hover { background: rgba(12, 74, 54, .08); }
      }
      .pbtn.repeat .repeat-one {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        font-family: var(--mono); font-size: 9px; font-weight: 500; line-height: 1;
        color: var(--accent);
        background: var(--panel);
        padding: 1px 2px;
        border-radius: 2px;
        pointer-events: none;
      }
      .now {
        flex: 1 1 0; min-width: 0; padding: 0 10px;
        height: 46px; min-height: 46px; max-height: 46px;
        display: flex; flex-direction: column; justify-content: flex-start;
        overflow: hidden;
      }
      .now .now-label {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: .26em; color: var(--ink-faint);
        height: 12px; min-height: 12px; line-height: 12px; flex: none;
        white-space: nowrap; overflow: hidden;
      }
      .now-row {
        display: flex; align-items: center; gap: 16px; min-width: 0;
        height: 34px; min-height: 34px; max-height: 34px;
        flex: none; overflow: hidden;
      }
      .now .now-title {
        font-size: 16px; letter-spacing: .1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        /* one line, always: a long title simply ellipsises. The lyrics
           live in their own full-width row below the title row, so a
           title of any length never competes with them for space */
        flex: 1 1 auto; min-width: 0;
        line-height: 34px; height: 34px;
      }
      /* Lyrics get a dedicated full-width row under the title row:
         exactly one English line (17px) + a 2px gap + one Japanese
         line (15px) = 34px tall, permanently reserved. A track with
         no lyrics — or a gap between lines — leaves the row empty but
         standing, so the title row above and the seek bar below never
         move, whatever the title's length. */
      .player-lyrics {
        max-width: 880px; margin: 0 auto;
        padding: 0 24px;
        height: 34px; min-height: 34px; max-height: 34px;
        overflow: hidden;
      }
      .lyric-en {
        display: block;
        height: 17px; min-height: 17px; max-height: 17px; line-height: 17px;
        font-size: 12.5px; letter-spacing: .02em;
        color: var(--ink-soft); opacity: .8;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .lyric-jp {
        display: block; margin-top: 2px;
        height: 15px; min-height: 15px; max-height: 15px; line-height: 15px;
        font-size: 10.5px; letter-spacing: .04em;
        color: var(--ink-faint); opacity: .95;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .list-toggle {
        background: none; border: none;
        border-bottom: 1px solid var(--line);
        color: var(--ink); padding: 6px 2px;
        font-size: 13px; letter-spacing: .16em;
        min-height: 40px; white-space: nowrap;
      }
      .list-toggle:hover { border-bottom-color: var(--accent); color: var(--accent); }

      /* ---------- music room: jackets on a wall ---------- */
      .mgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 30px 24px;
      }
      .mcard {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 14px 14px 16px;
        display: flex; flex-direction: column;
        transition: border-color .18s ease;
      }
      .mcard.playing { border-color: var(--accent); }
      .mcard-jacket {
        display: block; width: 100%;
        padding: 0; border: none; background: none;
        cursor: pointer;
      }
      .mcard-jacket img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
        border: 1px solid var(--line-soft);
      }
      /* placeholder jacket for tracks without artwork: the label's own
         typographic sleeve — ecru ground, deep green Mincho, number and
         title set large, artist along the bottom rule */
      .ph-jacket {
        width: 100%; aspect-ratio: 1 / 1;
        background: var(--bg);
        border: 1px solid var(--line);
        color: var(--accent);
        display: flex; flex-direction: column;
        padding: 16px;
        text-align: left;
      }
      .ph-jacket .ph-no {
        font-family: var(--mono); font-size: 11px; letter-spacing: .24em;
        color: var(--ink-faint);
      }
      .ph-jacket .ph-title {
        margin-top: auto;
        font-size: 24px; font-weight: 700; letter-spacing: .08em; line-height: 1.5;
        word-break: break-word;
      }
      .ph-jacket .ph-artist {
        margin-top: 10px; padding-top: 10px;
        border-top: 1px solid var(--accent);
        font-family: var(--mono); font-size: 10.5px; letter-spacing: .3em;
      }
      .mcard-meta { padding: 14px 2px 0; display: flex; flex-direction: column; flex: 1; }
      .mcard-title {
        font-size: 16.5px; font-weight: 700; letter-spacing: .05em; line-height: 1.55;
        word-break: break-word;
        /* fixed two-line slot: long titles clamp with an ellipsis so
           every card keeps the same height and the grid stays even */
        height: calc(16.5px * 1.55 * 2);
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .mcard-sub {
        margin-top: 6px;
        display: flex; align-items: baseline; gap: 12px;
        font-size: 12px; letter-spacing: .14em; color: var(--ink-soft);
      }
      .mcard-sub .mono { font-size: 11px; letter-spacing: .18em; }
      .mcard-sub .mstate { margin-left: auto; color: var(--accent); white-space: nowrap; }
      .mcard-foot {
        margin-top: auto; padding-top: 14px;
        display: flex; align-items: center; gap: 10px;
      }
      .mcard-foot .rule-line { flex: 1; border-top: 1px solid var(--line-soft); }
      .dl-btn {
        display: inline-flex; align-items: center; gap: 7px;
        border: 1px solid var(--accent); border-radius: 2px;
        color: var(--accent); background: none;
        padding: 8px 14px; min-height: 40px;
        font-size: 12.5px; letter-spacing: .14em;
        text-decoration: none;
        font-family: var(--serif);
      }
      .dl-btn:hover { background: var(--accent); color: #fff; }
      .dl-btn svg { width: 13px; height: 13px; display: block; }
      .dl-btn .mono { font-size: 10px; letter-spacing: .1em; }

      /* ---------- player thumbnail: current jacket, small and square ---------- */
      .now-thumb {
        flex: none;
        width: 34px; height: 34px;
        object-fit: cover; display: block;
        border: 1px solid var(--line);
      }
      .now-thumb-ph {
        flex: none;
        width: 34px; height: 34px;
        background: var(--bg);
        border: 1px solid var(--accent);
        color: var(--accent);
        display: flex; align-items: center; justify-content: center;
        font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
      }

      /* ---------- seek bar: one thin ruled line under the lyrics row ---------- */
      .seek-wrap {
        max-width: 880px; margin: 0 auto;
        padding: 12px 24px 0;
        display: flex; align-items: center; gap: 14px;
        height: 32px; min-height: 32px; max-height: 32px;
        overflow: hidden;
      }
      .seek-time {
        font-family: var(--mono);
        font-size: 11px; letter-spacing: .08em;
        color: var(--ink-soft);
        min-width: 38px;
        font-variant-numeric: tabular-nums;
      }
      .seek-time.end { text-align: right; color: var(--ink-faint); }
      .seek {
        flex: 1; min-width: 0;
        -webkit-appearance: none;
        appearance: none;
        height: 20px;
        background: transparent;
        cursor: pointer;
        margin: 0; padding: 0;
      }
      .seek::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--fill, 0%), var(--line) var(--fill, 0%), var(--line) 100%);
      }
      .seek::-webkit-slider-thumb {
        -webkit-appearance: none;

    <style>
      /* ---------- one glass standard for every window, and the
         surfaces flattened ----------
         Why the see-through differed per window: the pane itself
         (.win) was always the same glass, but the character
         windows lined their insides with nearly opaque sheets —
         .room-sheet at .95 in the record window, .char-card at
         .94 in the folder — while the music room's cards sat at
         .38 on the bare glass. Same frame, different lining.
         Now there is exactly one standard, shared by the record
         window, the folder, the music room and the player:
           pane tint   rgba(250,250,248,.54), flat, blur 24px
           body veil   rgba(255,255,255,.14), flat
           inner cards rgba(255,255,255,.44) — sheet, char cards,
                       music cards, tags boxes, placeholder jackets
         Readability is bought by raising the shared milky tint
         one step (pane .46/.36 -> .54 flat, cards .38 -> .44),
         never by re-opaquing a single window.
         Flattening: the title bars, window frame, taskbar, start
         button and start-menu head lose their multi-stop
         gradients, inset highlights and bevel shadows — each is

    <style>
      /* ---------- white glass, one step clearer ----------
         The milky tint on every window's white glass drops one
         uniform step — pane .54 -> .40, the body veil .14 -> .08,
         inner cards and sheets .44 -> .34, the inactive (white)
         title bar .58 -> .46 — so the desktop picture clouds
         through more strongly everywhere at once. The backdrop
         blur (24px) is untouched, and the black glass — active
         title bars, the taskbar, the start button's frame —
         keeps its current density exactly. Readability is held
         by the blur plus the remaining tint: dark ink still sits

    <style>
      /* ---------- Liquid Glass (iOS 26 style), over every glass surface ----------
         An approximation in pure CSS of Apple's Liquid Glass, layered
         over the existing monochrome glass standard — same unified
         density for every window, the taskbar, the start menu and
         the player; green stays state-only, red stays link-only,
         titles stay filename plates, surfaces stay flat-ish sheets.
         The liquid read comes from four things working together:
           1. a specular rim — a bright inset line on every edge,
              strongest at the top, like light refracting through
              the edge of a thick pane;
           2. a sheen — a soft diagonal wash of light laid across
              the surface (the ::before layer), plus a top glow;
           3. a lifted backdrop — blur 28px with saturation and
              brightness raised, so the picture behind the glass
              comes through juicier, not just cloudier;
           4. rounder corners — 20px continuous-feeling radii on
              windows, the menu and the taskbar's top edge.
         Readability is kept the same way as before: the milky tint
         stays (pane .36 plus the sheen's own white), the body veil
         rises slightly to .16, and the ink is untouched. */
      :root {
        --lg-filter: blur(28px) saturate(1.55) brightness(1.13) contrast(1.02);
        --lg-filter-bar: blur(28px) saturate(1.5) brightness(1.1) contrast(1.02);
        --lg-rim:
          inset 0 1px 1px rgba(255, 255, 255, .95),
          inset 0 -1px 1px rgba(255, 255, 255, .45),
          inset 1px 0 1px rgba(255, 255, 255, .50),
          inset -1px 0 1px rgba(255, 255, 255, .30),
          inset 0 0 0 1px rgba(255, 255, 255, .20),
          inset 0 20px 30px -20px rgba(255, 255, 255, .60);
        --lg-shadow:
          0 24px 60px rgba(8, 14, 20, .34),
          0 4px 16px rgba(8, 14, 20, .16);
        --lg-sheen: linear-gradient(128deg,
          rgba(255, 255, 255, .60) 0%,
          rgba(255, 255, 255, .14) 26%,
          rgba(255, 255, 255, .03) 50%,
          rgba(255, 255, 255, .16) 78%,
          rgba(255, 255, 255, .34) 100%);
      }

      /* ---- window panes (record / folder / music / player) ---- */
      .win, #player {
        background:
          var(--lg-sheen),
          linear-gradient(180deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, .05) 44%, rgba(20, 20, 18, .03)),
          rgba(250, 250, 248, .36);
        -webkit-backdrop-filter: var(--lg-filter);
        backdrop-filter: var(--lg-filter);
        border: 1px solid rgba(255, 255, 255, .68);
        border-radius: 20px;
        box-shadow: var(--lg-shadow), var(--lg-rim);
      }
      .win.active { border-color: rgba(140, 220, 170, .75); }
      #player.active { border-color: rgba(140, 220, 170, .75); }
      .win-maxed { border-radius: 10px; }
      /* the sheen layer: light flowing over the surface, above the
         pane's own fill but under nothing interactive — it never
         takes pointer events, and its white is kept faint enough
         that text under it stays fully readable */
      .win::before {
        content: ""; position: absolute; inset: 0; z-index: 25;
        border-radius: inherit; pointer-events: none;
        background:
          radial-gradient(120% 60% at 18% -8%, rgba(255, 255, 255, .34), rgba(255, 255, 255, 0) 55%),
          linear-gradient(115deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, .13) 45%, rgba(255, 255, 255, .02) 58%, rgba(255, 255, 255, 0) 72%);
      }
      /* the refractive edge: a second, tighter rim drawn over the
         whole pane so the contour itself catches the light */
      .win::after {
        content: ""; position: absolute; inset: 0; z-index: 26;
        border-radius: inherit; pointer-events: none;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .9),
          inset 0 -1px 0 rgba(255, 255, 255, .35),
          inset 1px 0 0 rgba(255, 255, 255, .38),
          inset -1px 0 0 rgba(255, 255, 255, .24);
      }
      .win-body {
        background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .10));
        border-radius: 0 0 19px 19px;
      }
      .win-maxed .win-body { border-radius: 0 0 9px 9px; }

      /* ---- title bars: black glass active, white glass inactive,
         both with the same specular top edge and sheen ---- */
      .win-bar, .win.active .win-bar {
        background:
          linear-gradient(128deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .07) 30%, rgba(255, 255, 255, 0) 55%, rgba(255, 255, 255, .12) 100%),
          linear-gradient(180deg, rgba(72, 72, 68, .78), rgba(14, 14, 12, .86));
        -webkit-backdrop-filter: var(--lg-filter-bar);
        backdrop-filter: var(--lg-filter-bar);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .75),
          inset 0 -2px 0 rgba(73, 170, 104, .85),
          inset 0 -14px 20px -14px rgba(255, 255, 255, .30);
        border-radius: 19px 19px 0 0;

          rgba(246, 246, 243, .42);
        -webkit-backdrop-filter: var(--lg-filter-bar);
        backdrop-filter: var(--lg-filter-bar);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .9),

        border-bottom: 1px solid rgba(20, 20, 18, .10);
        border-radius: 19px 19px 0 0;

      .win-maxed:not(.active) .win-bar { border-radius: 9px 9px 0 0; }
      /* window buttons become little glass lozenges */
      .win-btn {
        background: linear-gradient(180deg, rgba(255, 255, 255, .38), rgba(255, 255, 255, .14));
        border: 1px solid rgba(255, 255, 255, .65);
        border-radius: 10px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .8),

        backdrop-filter: blur(8px) saturate(1.4);
      }
      .win-min-btn, .win-max-btn, .win-close-btn {

      }
      .win:not(.active) .win-btn {
        background: linear-gradient(180deg, rgba(255, 255, 255, .62), rgba(255, 255, 255, .30));
        border-color: rgba(20, 20, 18, .22);
      }
      .win-btn:active { filter: brightness(1.12); }

      /* ---- inner cards and sheets: same liquid material, one step
         quieter so the pane stays the hero surface ---- */
      .win .card, .win .mcard, .win .tags-box,
      .win .char-card, .win .room-sheet, .win .ph-jacket,
      .win .room-sheet .tags-box {
        background:
          linear-gradient(128deg, rgba(255, 255, 255, .42) 0%, rgba(255, 255, 255, .10) 32%, rgba(255, 255, 255, .03) 58%, rgba(255, 255, 255, .18) 100%),
          rgba(255, 255, 255, .32);
        border: 1px solid rgba(255, 255, 255, .60);
        border-radius: 14px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .85),

          0 6px 16px rgba(8, 14, 20, .10);
        -webkit-backdrop-filter: blur(14px) saturate(1.4) brightness(1.07);
        backdrop-filter: blur(14px) saturate(1.4) brightness(1.07);
      }
      .room-portrait, .win .card img, .win .mcard-jacket img,

        border-radius: 10px;
      }

      /* ---- taskbar: black liquid glass, its top edge a bright

      .taskbar {
        background:
          linear-gradient(115deg, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, .04) 32%, rgba(255, 255, 255, 0) 58%, rgba(255, 255, 255, .10) 100%),
          linear-gradient(180deg, rgba(46, 46, 43, .80), rgba(10, 10, 9, .88));
        -webkit-backdrop-filter: var(--lg-filter-bar);
        backdrop-filter: var(--lg-filter-bar);
        border-top: 1px solid rgba(255, 255, 255, .55);
        border-radius: 18px 18px 0 0;
        box-shadow:
          0 -14px 34px rgba(8, 14, 20, .30),
          inset 0 1px 0 rgba(255, 255, 255, .65),
          inset 0 16px 22px -16px rgba(255, 255, 255, .45);
      }
      .start-btn {
        background:
          linear-gradient(128deg, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, .35) 40%, rgba(255, 255, 255, .55) 100%),
          rgba(248, 248, 246, .92);
        border-radius: 17px 12px 12px 0;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, .95),
          inset 0 -1px 0 rgba(255, 255, 255, .4),
          2px 0 8px rgba(0, 0, 0, .28);
      }
      .task-btn {

        border: 1px solid rgba(255, 255, 255, .45);
        border-radius: 10px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
      }

      #player .pbtn {

      /* ---- elastic motion: windows spring in, sink away on

      @keyframes lg-in {
        0% { opacity: 0; transform: scale(.88) translateY(16px); }
        55% { opacity: 1; transform: scale(1.025) translateY(-2px); }

        0% { opacity: 0; transform: translateY(12px) scale(.95); }

        animation: lg-in .5s cubic-bezier(.22, 1.32, .36, 1) both;

        animation: lg-menu-in .38s cubic-bezier(.22, 1.35, .36, 1) both;
        transform-origin: 4% 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .win-spawn, .win-restoring, .win-minimizing,
        .start-menu:not(.hidden) { animation: none; }

    </style>

    <style>
      /* ---------- Liquid Glass, final pass: the clearest pane yet,
         readability carried by the type, not by the veil ----------
         The tint drops one more unified step everywhere the glass
         is white — pane .36 -> .22, inner cards .32 -> .20, the
         body veil .16/.10 -> .05, the inactive title bar .42 ->
         .30, the start menu .38 -> .26 — so the picture behind
         the glass reads more strongly than in any previous pass.
         The black glass (active title bars, taskbar) keeps its
         density: white text lives only there.
         What keeps the words readable on the clearer glass:
           - ink: inside the desktop, --ink becomes a near-black
             neutral (#14161a), the soft grey deepens a full step
             (#39424a) and the faint grey two steps (#5b656d);
             the link red deepens to #b01e14;
           - weight: body copy, snippets, rows and tags gain a
             step of weight (Mincho 400 -> 500 where it was light);
           - halo: text areas carry a faint white text-shadow —
             a light halo behind dark glyphs that lifts them off
             both the bright and the dark patches of the picture
             showing through, without any milky sheet under them.
         The liquid material stays where it belongs — on the
         frame: the specular rim and contour highlight are
         untouched, the title bars keep their sheen, and the
         sheen layer over the pane's text area is thinned to a
         whisper. The elastic animations are unchanged. */

      /* ---- the clearer pane ---- */

          linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .02) 44%, rgba(20, 20, 18, .02)),
          rgba(250, 250, 248, .22);
        -webkit-backdrop-filter: blur(28px) saturate(1.35) brightness(1.10) contrast(1.03);

      .win::before {
        background:
          radial-gradient(120% 60% at 18% -8%, rgba(255, 255, 255, .16), rgba(255, 255, 255, 0) 55%),

      .start-menu {

          linear-gradient(128deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .06) 26%, rgba(255, 255, 255, .01) 50%, rgba(255, 255, 255, .08) 78%, rgba(255, 255, 255, .20) 100%),
          rgba(250, 250, 248, .26);

      .sm-col-main { background: rgba(255, 255, 255, .10); }
      .sm-col-sub { background: rgba(20, 20, 18, .04); }

      /* ---- ink-forward type on the glass ---- */
      .win-body, .player-body, .sm-col-main, .sm-col-sub {

    <style>
      /* ---------- PLAYER ONLY: Liquid Glass trial ----------
         A one-window experiment in the liquid-glass card style

         player changes except the material of its pane.

           - title bar, filename plate, drag / minimize: untouched;
           - inner layout and the flat transport row: untouched;
           - every other window keeps the dark clear glass of the

         The liquid read is faked the way pure CSS can fake it:
           1. a juicier backdrop — blur 30px with saturation and
              brightness lifted, so the balcony picture behind the
              pane comes through vivid instead of just cloudy;
           2. a specular rim — bright inset lines on all four
              edges, strongest at the top, plus a soft bounce of
              light along the bottom edge, like light bending
              through the rim of a thick pane;
           3. a sheen — a faint diagonal wash of light laid over
              the surface (::before), kept whisper-thin over the
              text area so the white type stays fully readable;
           4. a deeper, softer drop shadow so the sheet floats.

         the interior type is white, per the FINAL pass) — only

        -webkit-backdrop-filter: blur(30px) saturate(1.65) brightness(1.12) contrast(1.03) !important;
        backdrop-filter: blur(30px) saturate(1.65) brightness(1.12) contrast(1.03) !important;
        border: 1px solid rgba(255, 255, 255, .72) !important;
        box-shadow:
          0 24px 60px rgba(4, 8, 12, .50),
          0 4px 16px rgba(4, 8, 12, .28),
          inset 0 1px 1px rgba(255, 255, 255, .95),

          inset -1px 0 1px rgba(255, 255, 255, .28),
          inset 0 0 0 1px rgba(255, 255, 255, .16),
          inset 0 22px 32px -22px rgba(255, 255, 255, .55),

    <style>
      /* ---------- PLAYER ONLY: black glass, one step clearer ----------

         inner layout and the flat white transport row untouched,
         and every other window keeps the dark clear glass.
         Two moves:
           1. clearer — the pane tint drops from rgba(12,16,20,.44)
              to a black rgba(4,6,8,.38), the sheen sweeps thin
              down (.26/.20 peaks -> .18/.12), and the backdrop

              real darkening (brightness .62), so the balcony
              picture's shapes still show through, only darker;
           2. blacker — what tint remains is now a neutral black,
              not a blue-grey: the base fill, the lower gradient
              stop and the title bar all sit on near-black, and the
              backdrop brightness does the darkening work, so the
              pane reads as black glass even where the picture
              behind it is bright (the white shirt under the
              player washed the first two probe captures out to
              beige at brightness .94 and .78), like the

         feature: the inset edge light is kept at full strength

    <style>
      /* ---------- PLAYER ONLY: black glass, more transparent ----------
         Third pass, same #player-only scope: size, position, shape,
         layout, flat white transport row and white type untouched.
         The previous pass darkened twice over — a black tint at
         .38 PLUS a backdrop brightness of .62 — so the balcony
         picture behind the pane was crushed before it ever showed.
         This pass undoes both halves of that double-darkening:
           - tint: rgba(4,6,8,.38) -> rgba(4,6,8,.22)
           - backdrop brightness: .62 -> .88 (back toward 1.0, so
             the picture itself comes through, not a darkened copy)
           - blur: 26px -> 20px, so the shapes behind the glass
             (railing, figures, stars) stay legible as shapes
             instead of dissolving into a uniform smudge;
           - sheen sweeps thinned again (.18/.12 -> .10/.06,
             ::before .14 -> .07) so the white washes stop veiling
             the picture.
         The specular rim stays at full strength — on a clearer
         pane the bright edge is what still reads as glass — and
         the title bar stays one step denser than the pane
         (tint .82/.88 -> .64/.72, brightness .82 -> .90) so the
         filename plate keeps its footing. Values stop here, just
         short of where white type would sink over the brightest
         parts of the balcony picture (pale shirts / sky). */

    <style>
      /* ---------- tap sparkles: app-game style burst at the touch point ----------
         A fixed, fully transparent layer above everything. It never
         takes pointer events, so window drags, button taps and the
         mirror hit-test underneath are untouched. Particles are spawned
         by the script at the end of the body and remove themselves. */
      #sparkle-layer {
        position: fixed; inset: 0;

        pointer-events: none;
        overflow: hidden;

      .sparkle {
        position: absolute;
        left: 0; top: 0;
        pointer-events: none;

    <style>

         ticker for every title, long or short: hold still, glide

      #now-title { text-overflow: clip; }

      /* ===== 3. character pictures: portrait 3 / 4 frame,
         picture shown whole inside it (contain, never cropped) =====
         The frame ratio is the reference site's list-card display
         ratio, measured from its CSS: aspect-ratio 3 / 4 (portrait).
         (An earlier build used 1216 / 832 — that was the source
         image file's pixel size, not the display ratio.) The
         picture itself is used as-is: object-fit contain fits the
         entire image inside the frame with nothing cut off, and
         the leftover space simply shows the window glass behind
         it. */

    <style>
      /* ---------- FINAL 3: shuffle / repeat OFF reads as OFF ----------
         On the dark glass the off state was plain white at full
         strength — the same brightness as every other lit control —
         so "off" differed from "on" by hue alone, and kept being
         misread. Off now carries no mark at all: the glyph simply
         loses its voice — a dull, desaturated pale grey-green at
         well under half strength, so it sits visibly powered down
         next to everything else on the glass. On is the vivid
         state green (#6fe3a5) at full strength, so the two states
         separate at a glance by saturation and clarity alone:
         off = washed-out and faint, on = bright green. Repeat
         keeps its third shape: one = green + the "1" badge in
         the middle of the loop. */
      #player .pbtn.shuffle:not(.on),
      #player .pbtn.repeat:not(.on) {
        color: rgba(186, 199, 192, .42) !important;
        opacity: 1 !important;
      }
      /* on: green at full strength */
      #player .pbtn.shuffle.on,
      #player .pbtn.repeat.on {
        color: #6fe3a5 !important;
        opacity: 1 !important;
      }
      /* the glyphs are stroke="currentColor" SVGs, and the glass
         pass pins every player SVG to white at the svg level
         (.player-body svg) — a colour set on the button alone
         never reaches the strokes, so both states are restated
         on the svg itself */
      #player .pbtn.shuffle:not(.on) svg,
      #player .pbtn.repeat:not(.on) svg {
        color: rgba(186, 199, 192, .42) !important;
      }
      #player .pbtn.shuffle.on svg,
      #player .pbtn.repeat.on svg {
        color: #6fe3a5 !important;
      }
    </style>

        }
        if (shuffleOn && TRACKS.length > 1) { loadTrack(nextIndex(), true); return; }
        if (trackIndex < TRACKS.length - 1) { loadTrack(trackIndex + 1, true); return; }
        if (repeatMode === 1 && TRACKS.length) { loadTrack(0, true); return; }
        refreshPlayerUI(); /* off: stop on the last track */
      });
      /* ---------- the player is a small window on the desktop ----------
         It moves into the window layer and joins the same rules as
         every other window: drag by the title bar, focus raises it,
         minimize (and its close button) shelve it into the taskbar
         while the music keeps playing. It starts at the right side,
         placed the first time the desktop is shown. */
      var playerWin = playerEl;
      playerWin._key = "player";
      winLayer.appendChild(playerWin);
      addTaskButton(playerWin, "PLAYER");
      playerWin.addEventListener("pointerdown", function () { focusWindow(playerWin); });
      wireWinDrag(playerWin, document.getElementById("player-bar"));
      document.getElementById("player-min").addEventListener("click", function () { minimizeWindow(playerWin); });
      playerWin._maxBtn = document.getElementById("player-max");
      playerWin._maxBtn.addEventListener("click", function () { toggleMaximize(playerWin); });
      document.getElementById("player-close").addEventListener("click", function () { minimizeWindow(playerWin); });
      /* no addResizeHandles(playerWin): the player's size is fixed */
      var playerPlaced = false;
      var playerCompact = false;
      /* wide desktops: the fixed ratio size (34% x 55%). Position
         may come from the saved geometry; the size is always the
         fixed default — applyGeom enforces that for the player
         regardless of what was saved */
      function placePlayerFixed() {
        playerCompact = false;
        var sp = savedGeom.player;
        var g = {
          l: (sp && sp.l != null) ? sp.l : DEFAULT_GEOM.player.l,
          t: (sp && sp.t != null) ? sp.t : DEFAULT_GEOM.player.t,
          w: DEFAULT_GEOM.player.w,
          h: DEFAULT_GEOM.player.h
        };
        applyGeom(playerWin, g);
      }
      /* narrow screens: the fixed ratio would crush the player
         into a sliver (34% of 390px at a 64.5% left offset), so
         it keeps the compact top-right placement instead — the
         stylesheet's width (344px, capped by the screen) and a
         content-driven height, with no saved geometry */
      function placePlayerCompact() {
        playerCompact = true;
        playerWin._geo = null;
        playerWin.style.width = "";
        playerWin.style.height = "";
        var desk = winLayer.getBoundingClientRect();
        var w = playerWin.offsetWidth || Math.min(344, desk.width - 16);
        playerWin.style.left = Math.max(8, desk.width - w - 14) + "px";
        playerWin.style.top = "14px";
      }
      function placePlayer() {
        if (playerPlaced) return;
        var desk = winLayer.getBoundingClientRect();
        if (!desk.width) return;
        playerPlaced = true;
        if (desk.width < 700) placePlayerCompact();
        else placePlayerFixed();
        focusWindow(playerWin);
      }

      /* the screen itself changed size: every standing window
         re-derives its pixels from its ratios, so the fixed
         composition survives rotation and window resizing.
         Maximized windows are left alone (temporary state). */
      var deskResizeTimer = null;
      window.addEventListener("resize", function () {
        if (deskResizeTimer) clearTimeout(deskResizeTimer);
        deskResizeTimer = setTimeout(function () {
          var desk = winLayer.getBoundingClientRect();
          var wins = winLayer.children;
          for (var i = 0; i < wins.length; i++) {
            var w = wins[i];
            if (w === playerWin) continue; /* handled just below */
            if (!w._max && w._geo) applyGeom(w, w._geo);
          }
          /* the player crosses between its two placements only
             when the screen crosses the 700px line, so a resize
             inside one regime never snaps a dragged player back */
          if (playerPlaced && !playerWin._max) {
            if (desk.width < 700) { if (!playerCompact) placePlayerCompact(); }
            else if (playerCompact) placePlayerFixed();
            else if (playerWin._geo) applyGeom(playerWin, playerWin._geo);
          }
        }, 120);
      });

      /* ---------- taskbar tray clock: real time, Asia/Tokyo ---------- */
      var trayClockEl = document.getElementById("tray-clock");
      var trayDateEl = document.getElementById("tray-date");
      function trayPart(parts, type) {
        for (var i = 0; i < parts.length; i++) if (parts[i].type === type) return parts[i].value;
        return "";
      }
      function updateClock() {
        try {
          var now = new Date();
          var tp = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(now);
          var dp = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short" }).formatToParts(now);
          trayClockEl.textContent = trayPart(tp, "hour") + ":" + trayPart(tp, "minute");
          trayDateEl.textContent = trayPart(dp, "month") + "月" + trayPart(dp, "day") + "日(" + trayPart(dp, "weekday") + ")";
        } catch (e) {}
      }
      updateClock();
      setInterval(updateClock, 10000);

      /* ---------- UI language switch: the tray button cycles
         JP -> EN -> KR -> JP and re-renders every UI string from
         the dictionary at the top of this script — static start
         menu text (data-i18n), aria labels (data-i18n-aria and
         the window chrome classes), and whatever dynamic pieces
         are on screen right now (copy buttons, room nav, the
         folder / music guidance lines). The choice is saved, so
         the desktop comes back in the same language. ---------- */
      function applyLang() {
        var d = I18N[uiLang];
        var nodes = document.querySelectorAll("[data-i18n]");
        for (var i = 0; i < nodes.length; i++) {
          var k = nodes[i].getAttribute("data-i18n");
          if (typeof d[k] === "string") nodes[i].textContent = d[k];
        }
        var chrome = [
          [".win-min-btn", "minimize"],
          [".win-max-btn", "maximize"],
          [".win-close-btn", "closeWin"]
        ];
        for (var c = 0; c < chrome.length; c++) {
          var btns = document.querySelectorAll(chrome[c][0]);
          for (var b = 0; b < btns.length; b++) {
            if (!btns[b].hasAttribute("data-i18n-aria")) btns[b].setAttribute("aria-label", d[chrome[c][1]]);
          }
        }
        var anodes = document.querySelectorAll("[data-i18n-aria]");
        for (var j = 0; j < anodes.length; j++) {
          var ak = anodes[j].getAttribute("data-i18n-aria");
          if (typeof d[ak] === "string") anodes[j].setAttribute("aria-label", d[ak]);
        }
        var sb = document.getElementById("start-btn");
        if (sb) sb.title = d.start;
        var cbs = document.querySelectorAll(".copy-btn");
        for (var a = 0; a < cbs.length; a++) { cbs[a].textContent = d.copy; cbs[a].classList.remove("copied"); }
        var tls = document.querySelectorAll(".tags-label");
        for (var t2 = 0; t2 < tls.length; t2++) tls[t2].textContent = d.tagsLabel;
        var navs = document.querySelectorAll(".nav-btn[data-nav]");
        for (var n = 0; n < navs.length; n++) {
          if (navs[n].childNodes[0]) navs[n].childNodes[0].nodeValue = navs[n].getAttribute("data-nav") === "prev" ? d.prevRoom : d.nextRoom;
        }
        var fe = document.querySelector(".folder-epi");
        if (fe) fe.textContent = d.folderHint;
        var mf = document.querySelector(".win-foot-note");
        if (mf) mf.innerHTML = d.musicFoot + '<br /><span class="mono">ALL TRACKS BY CHICKEN</span>';
        if (typeof refreshShuffleUI === "function") refreshShuffleUI();
        if (typeof refreshRepeatUI === "function") refreshRepeatUI();
        var lb = document.getElementById("lang-btn");
        if (lb) { lb.textContent = LANG_BADGE[uiLang]; lb.setAttribute("aria-label", d.langBtn); }
        try { window.localStorage.setItem(LANG_STORE_KEY, uiLang); } catch (e) {}
      }
      var langBtn = document.getElementById("lang-btn");
      if (langBtn) {
        langBtn.addEventListener("click", function () {
          uiLang = LANG_ORDER[(LANG_ORDER.indexOf(uiLang) + 1) % LANG_ORDER.length];
          applyLang();
        });
      }
      applyLang();

      /* ---------- start menu ---------- */
      /* CHICKEN's X (formerly Twitter) profile — the start-menu
         header tile links here in a new tab. This is the one
         place the URL lives; clear it back to "" and the tile
         goes inert again instead of pointing anywhere wrong. */
      var X_PROFILE_URL = "https://x.com/torichicken__";
      var startBtn = document.getElementById("start-btn");
      var startMenu = document.getElementById("start-menu");
      var smUserIcon = document.getElementById("sm-user-icon");
      if (smUserIcon) {
        if (X_PROFILE_URL) {
          smUserIcon.setAttribute("href", X_PROFILE_URL);
          smUserIcon.setAttribute("target", "_blank");
          smUserIcon.setAttribute("rel", "noopener noreferrer");
          smUserIcon.removeAttribute("aria-disabled");
        } else {
          smUserIcon.removeAttribute("href");
          smUserIcon.setAttribute("aria-disabled", "true");
        }
        smUserIcon.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!X_PROFILE_URL) e.preventDefault();
          else toggleStartMenu(false); /* the profile opens in its own tab */
        });
      }
      function toggleStartMenu(force) {
        var open = (typeof force === "boolean") ? force : startMenu.classList.contains("hidden");
        startMenu.classList.toggle("hidden", !open);
        startBtn.setAttribute("aria-expanded", open ? "true" : "false");
      }
      startBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleStartMenu(); });
      document.addEventListener("click", function (e) {
        if (!startMenu.classList.contains("hidden") && !startMenu.contains(e.target)) toggleStartMenu(false);
      });
      startMenu.addEventListener("click", function (e) {
        var b = (e.target && e.target.closest) ? e.target.closest("button") : null;
        if (!b) return;
        var act = b.getAttribute("data-act");
        toggleStartMenu(false);
        if (act === "entrance") { showView("entrance"); }
        else if (act === "player") { restoreWindow(playerWin); }
        else if (act === "folder") { openFolderWindow(); }
        else if (act === "music") { openMusicWindow(); }
        else if (act === "min-all") {
          var mw = winLayer.children;
          for (var j = mw.length - 1; j >= 0; j--) minimizeWindow(mw[j]);
        }
        else if (act === "close-all") {
          var keys = Object.keys(openWins);
          for (var i = 0; i < keys.length; i++) closeWindow(openWins[keys[i]]);
        }
      });

      /* ---------- synced lyrics in the player's dedicated lyrics row ---------- */
      var lyricEnEl = document.getElementById("lyric-en");
      var lyricJpEl = document.getElementById("lyric-jp");
      var currentLyricIdx = -2;
      function updateLyrics(t) {
        var cues = TRACK_LYRICS[trackIndex] || null;
        var idx = -1;
        if (cues && isFinite(t)) {
          for (var i = 0; i < cues.length; i++) {
            if (t >= cues[i][0] && t < cues[i][1]) { idx = i; break; }
            if (t < cues[i][0]) break;
          }
        }
        if (idx === currentLyricIdx) return;
        currentLyricIdx = idx;
        if (idx >= 0 && cues) {
          lyricEnEl.textContent = cues[idx][2];
          lyricJpEl.textContent = cues[idx][3];
          lyricEnEl.title = cues[idx][2];
          lyricJpEl.title = cues[idx][3];
        } else {
          lyricEnEl.textContent = "";
          lyricJpEl.textContent = "";
          lyricEnEl.title = "";
          lyricJpEl.title = "";
        }
      }

      /* ---------- seek bar ---------- */
      var seekEl = document.getElementById("seek");
      var timeCurEl = document.getElementById("time-cur");
      var timeDurEl = document.getElementById("time-dur");
      var seeking = false;
      function formatTime(s) {
        if (!isFinite(s) || s < 0) s = 0;
        s = Math.floor(s);
        var m = Math.floor(s / 60);
        var sec = s % 60;
        return m + ":" + ("0" + sec).slice(-2);
      }
      function refreshSeek() {
        var dur = audio.duration;
        if (isFinite(dur) && dur > 0) {
          seekEl.max = dur;
          timeDurEl.textContent = "-" + formatTime(Math.max(0, dur - audio.currentTime));
          if (!seeking) seekEl.value = audio.currentTime;
          seekEl.style.setProperty("--fill", (audio.currentTime / dur * 100) + "%");
        } else {
          seekEl.max = 0;
          if (!seeking) seekEl.value = 0;
          seekEl.style.setProperty("--fill", "0%");
          timeDurEl.textContent = "0:00";
        }
        timeCurEl.textContent = formatTime(audio.currentTime);
        if (!seeking) updateLyrics(audio.currentTime);
      }
      seekEl.addEventListener("input", function () {
        seeking = true;
        var dur = audio.duration;
        if (isFinite(dur) && dur > 0) {
          seekEl.style.setProperty("--fill", (seekEl.value / dur * 100) + "%");
        }
        var v = parseFloat(seekEl.value);
        timeCurEl.textContent = formatTime(v);
        updateLyrics(v);
      });
      seekEl.addEventListener("change", function () {
        var t = parseFloat(seekEl.value);
        if (isFinite(t)) { try { audio.currentTime = t; } catch (e) {} }
        seeking = false;
        refreshSeek();
      });
      audio.addEventListener("timeupdate", refreshSeek);
      audio.addEventListener("loadedmetadata", refreshSeek);
      audio.addEventListener("durationchange", refreshSeek);
      audio.addEventListener("seeked", refreshSeek);

      /* ---------- music room: the jacket wall ---------- */
      var mgridEl = document.getElementById("mgrid");
      function jacketNode(t, i) {
        if (t.jacket) {
          var img = document.createElement("img");
          img.src = t.jacket;
          img.alt = t.title + " のジャケット";
          return img;
        }
        var ph = document.createElement("span");
        ph.className = "ph-jacket";
        var no = document.createElement("span");
        no.className = "ph-no";
        no.textContent = "TRACK " + ("0" + (i + 1)).slice(-2);
        var ttl = document.createElement("span");
        ttl.className = "ph-title";
        ttl.textContent = t.title;
        var art = document.createElement("span");
        art.className = "ph-artist";
        art.textContent = t.artist || "";
        ph.appendChild(no); ph.appendChild(ttl); ph.appendChild(art);
        return ph;
      }
      function buildMusicRoom() {
        mgridEl.innerHTML = "";
        TRACKS.forEach(function (t, i) {
          var card = document.createElement("div");
          card.className = "mcard";
          var play = document.createElement("button");
          play.type = "button";
          play.className = "mcard-jacket";
          play.setAttribute("aria-label", t.title + " を再生");
          play.appendChild(jacketNode(t, i));
          play.addEventListener("click", function () {
            if (trackIndex === i && audio.src) {
              if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
              else audio.pause();
            } else {
              loadTrack(i, true);
            }
          });
          var meta = document.createElement("div");
          meta.className = "mcard-meta";
          var ttl = document.createElement("div");
          ttl.className = "mcard-title";
          ttl.textContent = t.title;
          var sub = document.createElement("div");
          sub.className = "mcard-sub";
          var art = document.createElement("span");
          art.textContent = t.artist || "";
          var dur = document.createElement("span");
          dur.className = "mono";
          dur.textContent = t.dur || "";
          var st = document.createElement("span");
          st.className = "mstate";
          sub.appendChild(art); sub.appendChild(dur); sub.appendChild(st);
          var foot = document.createElement("div");
          foot.className = "mcard-foot";
          var line = document.createElement("span");
          line.className = "rule-line";
          var dl = document.createElement("a");
          dl.className = "dl-btn";
          dl.href = t.src;
          dl.setAttribute("download", t.dl || "");
          dl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12" /><path d="M6 11l6 6 6-6" /><path d="M4 21h16" /></svg><span>DL</span>';
          dl.setAttribute("aria-label", t.title + " のMP3をダウンロード");
          foot.appendChild(line); foot.appendChild(dl);
          meta.appendChild(ttl); meta.appendChild(sub); meta.appendChild(foot);
          card.appendChild(play); card.appendChild(meta);
          mgridEl.appendChild(card);
        });
      }
      function refreshMusicCards(playing) {
        var cards = mgridEl.children;
        for (var i = 0; i < cards.length; i++) {
          var isCur = i === trackIndex;
          cards[i].classList.toggle("playing", isCur);
          var st = cards[i].querySelector(".mstate");
          if (st) st.textContent = isCur ? (playing ? "再生中" : "選択中") : "";
        }
      }

      buildIcons();
      buildMusicRoom();
      if (TRACKS.length) { audio.src = TRACKS[0].src; }
      refreshPlayerUI();
      refreshSeek();
      showView("entrance");
    </script>
    <script>
      /* ---------- tap sparkles ----------
         On every tap / click, a small burst of star and cross sparkles
         flies out from the touch point, drifts slightly downward and
         fades — the tap feedback of a mobile game. Purely decorative:
         the layer ignores pointer events and this listener never
         stops or alters the event, so all existing interaction
         (mirror tap, window drag, buttons) behaves exactly as before.
         Disabled entirely under prefers-reduced-motion. */
      (function () {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var layer = document.createElement("div");
        layer.id = "sparkle-layer";
        layer.setAttribute("aria-hidden", "true");
        document.body.appendChild(layer);

        var STAR = '<svg viewBox="0 0 24 24" fill="COLOR" aria-hidden="true"><path d="M12 1.5 L14.6 9.4 L22.5 12 L14.6 14.6 L12 22.5 L9.4 14.6 L1.5 12 L9.4 9.4 Z"/></svg>';
        var CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="COLOR" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5v17M3.5 12h17"/></svg>';
        var DOT = '<svg viewBox="0 0 24 24" fill="COLOR" aria-hidden="true"><circle cx="12" cy="12" r="5"/></svg>';
        var WHITE = "#ffffff";
        var GREEN = "#2fbf71";
        var active = 0;

        function burst(x, y) {
          var n = 8 + Math.floor(Math.random() * 5); /* 8–12 pieces */
          for (var i = 0; i < n; i++) {
            if (active > 140) return;
            var green = Math.random() < 0.28;
            var color = green ? GREEN : WHITE;
            var shape = Math.random();
            var html = shape < 0.55 ? STAR : (shape < 0.85 ? CROSS : DOT);
            var el = document.createElement("span");
            el.className = "sparkle";
            var size = 6 + Math.random() * 9; /* 6–15px */
            el.style.width = size + "px";
            el.style.height = size + "px";
            el.innerHTML = html.split("COLOR").join(color);
            layer.appendChild(el);
            active++;

            var angle = Math.random() * Math.PI * 2;
            var dist = 26 + Math.random() * 58;
            var dx = Math.cos(angle) * dist;
            var dy = Math.sin(angle) * dist + 18 + Math.random() * 30; /* slight fall */
            var rot = (Math.random() * 160 - 80) + "deg";
            var dur = 520 + Math.random() * 340;
            el.style.left = x + "px";
            el.style.top = y + "px";
            var anim = el.animate([
              { transform: "translate(-50%, -50%) rotate(0deg) scale(.4)", opacity: 1 },
              { transform: "translate(calc(-50% + " + dx * 0.7 + "px), calc(-50% + " + dy * 0.55 + "px)) rotate(" + rot + ") scale(1)", opacity: 1, offset: 0.45 },
              { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) rotate(" + rot + ") scale(.25)", opacity: 0 }
            ], { duration: dur, easing: "cubic-bezier(.17,.67,.35,1)" });
            (function (el, anim) {
              function done() { active--; if (el.parentNode) el.parentNode.removeChild(el); }
              if (anim) { anim.onfinish = done; anim.oncancel = done; }
              else { setTimeout(done, 900); }
            })(el, anim);
          }
        }

        document.addEventListener("pointerdown", function (e) {
          burst(e.clientX, e.clientY);
        }, { passive: true });
      })();
    </script>
  </body>
